# Deploy mirror of smp_v2 task `Umt-Tracking-G1-No-State-Estimation`
# (smp_v2/src/tasks/umt/__init__.py, env_cfg.py). Values dumped from the
# task cfg on 2026-08-27:
#   default_joint_pos : mjlab KNEES_BENT_KEYFRAME (zero point of joint_pos_rel)
#   stiffness/damping : G1_DEX3_BODY_ACTUATORS (== mjlab G1 actuators)
#   actions.scale     : G1_ACTION_SCALE = 0.25 * effort / stiffness
# Joint order = 29 body joints in Unitree SDK motor order (identity map);
# the 14 Dex3 finger joints are not observed or actuated by this policy.
