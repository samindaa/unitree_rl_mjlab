    joint_names: [.*]
    scale: [0.5475, 0.3507, 0.5475, 0.3507, 0.4386, 0.4386, 0.5475, 0.3507, 0.5475, 0.3507, 0.4386, 0.4386, 0.5475, 0.4386, 0.4386,
