robot: "g1"
# G1 29dof + Dex3-1 hands (deploy/robots/g1_dex3). The hands are driven over
# rt/dex3/<side>/cmd and reported on rt/dex3/<side>/state, like the real ones.
# Generated by scripts/make_g1_dex3_scene.py — do not edit the XML by hand.
robot_scene: "src/assets/robots/unitree_g1/xmls/scene_g1_dex3.xml"
# G1 29dof with the fixed rubber hands (deploy/robots/g1):
#robot_scene: "src/assets/robots/unitree_g1/xmls/scene_g1.xml"
#robot: "g1_23dof"
#robot_scene: "src/assets/robots/unitree_g1/xmls/scene_g1_23dof.xml"
#robot: "h1_2"
#robot_scene: "src/assets/robots/unitree_h1_2/xmls/scene_h1_2.xml"
#robot: "go2"
#robot_scene: "src/assets/robots/unitree_go2/xmls/scene_go2.xml"
#robot: "a2"
#robot_scene: "src/assets/robots/unitree_a2/xmls/scene_a2.xml"

domain_id: 0  # Domain id
interface: "lo" # Interface

use_joystick: 1 # Simulate Unitree WirelessController using a gamepad
joystick_type: "keyboard" # support "xbox" and "switch" gamepad layout, or "keyboard" (no hardware)
joystick_device: "/dev/input/js0" # Device path; unused by "keyboard"
joystick_bits: 16 # Some game controllers may only have 8-bit accuracy

# --- joystick_type: "keyboard" ---------------------------------------------
# Type these keys in *this* terminal to drive the controller FSM. A terminal
# reports one key at a time, so each FSM transition chord is bound to a single
# key; pressing it asserts the whole chord for keyboard_press_duration seconds.
# Button names match the `transitions` expressions in the controller's
# config.yaml (L1/L2/R1/R2 are accepted as aliases for LB/LT/RB/RT).
keyboard_map:
  "1": "LT + up"  # Passive  -> FixStand
  "2": "RT + A"   # FixStand -> Velocity  (also Mimic -> Velocity)
  "3": "RB + A"   # Velocity -> Mimic
  "4": "RB + B"   # Velocity -> HiphiEaseIn -> HiphiStudent -> HiphiEaseOut (g1_dex3)
  "0": "LT + B"   # any      -> Passive (damping)
keyboard_press_duration: 0.3 # Seconds a chord stays asserted after a key press
keyboard_axis_step: 0.1 # Velocity command increment per w/a/s/d/q/e press
# LT/RT arrive as Axis values and are low-pass filtered by the controller, so they
# are asserted this many seconds before the rest of the chord (~23 ms is the minimum
# for them to cross the press threshold; a human holds L2 before tapping Up).
keyboard_trigger_lead: 0.15

print_scene_information: 1 # Print link, joint and sensors information of robot

enable_elastic_band: 1 # Virtual spring band, used for lifting h1

# UDP port on 127.0.0.1 where the simulator streams (time, qpos) at 100 Hz for
# scripts/sim_viser_mirror.py (browser-based viewer; fast over remote desktop).
# Set to 0 to disable.
state_tap_port: 9870

# --- Streams for the deploy controller (msgs/stream_msgs.h) -----------------
# State estimate: ground-truth pose of `odom_site` in the world + its twist in
# the site frame, as nav_msgs Odometry on rt/odom_pelvis. imu_in_pelvis is the
# site mjlab's imu_lin_vel / imu_ang_vel sensors use in training.
odom_enable: 1
odom_topic: "rt/odom_pelvis"
odom_site: "imu_in_pelvis"
odom_divider: 2 # bridge ticks (1 kHz) per message -> 500 Hz
# State-estimator randomization, mirroring smp_v2 EstimatorNoiseCfg
# (tasks/hiphi_tracking_multi_distill/env_cfg.py; training defaults in the
# comments): a uniform bias in [-bound, +bound] per axis drawn at start (and
# every bias_redraw_s if > 0 — training redraws per episode) plus Gaussian
# noise per message, position in the pelvis (IMU site) frame, velocity in the
# site frame. All 0 = clean (the deployment condition).
# Clean (deployment condition) — swap the comment markers on the two blocks:
#odom_randomize:
#  pos_bias_m: 0.0
#  vel_bias: 0.0
#  pos_noise_m: 0.0
#  vel_noise: 0.0
#  bias_redraw_s: 0
#  seed: 0            # 0 = random
# Training values (smp_v2 EstimatorNoiseCfg):
odom_randomize:
  pos_bias_m: 0.01
  vel_bias: 0.05
  pos_noise_m: 0.002
  vel_noise: 0.02
  bias_redraw_s: 0
  seed: 0            # 0 = random

# Depth camera: renders the scene camera `camera_name` (scene_g1_dex3.xml,
# head-mounted with the training camera's pose/fovy) off screen and publishes
# 64x36 planar z-depth in mm as an organized PointCloud2 on rt/depth_camera.
# 0 = no return (matches the training renderer and a real D435).
depth_camera:
  enable: 1
  gl: "egl" # "egl": own context on the GPU device (works headless, hardware GL on Wayland sessions); "glfw": hidden window
  camera_name: "depth_camera"
  topic: "rt/depth_camera"
  width: 80   # must match the deployed student's depth frame (hiphi_student v1: 60x80; v0: 36x64)
  height: 60
  hz: 30
  delay_ms: 0 # sim2sim camera-latency injection; keep 0 unless sweeping
  dump_dir: "" # e.g. /tmp/depth_dump: every dump_every-th frame as 16-bit PNG + qpos sidecar
  dump_every: 0
  # Depth randomization, mirroring smp_v2 DepthRandomizationCfg /
  # mdp.RandomizedCameraDepth (LadderMan recipe; training defaults in the
  # comments): integer image shift drawn at start (and every shift_redraw_s
  # if > 0 — training redraws per episode), then Gaussian noise, then pixel
  # dropout to 0, per published frame. Object masking needs scene objects
  # and is not available here. All 0 = clean.
  # Clean (deployment condition) — swap the comment markers on the two blocks:
  #randomize:
  #  noise_std_m: 0.0
  #  dropout_p: 0.0
  #  shift_px: 0
  #  shift_redraw_s: 0
  #  seed: 0            # 0 = random
  # Training values (smp_v2 DepthRandomizationCfg):
  randomize:
    noise_std_m: 0.005
    dropout_p: 0.05
    shift_px: 2
    shift_redraw_s: 0
    seed: 0            # 0 = random
